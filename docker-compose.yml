services:
  cat-audio-api:
    build: .
    image: cat-sound-converter:latest
    container_name: cat-sound-converter
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      WEB_CONCURRENCY: 1
      CAT_API_TOKEN: "${CAT_API_TOKEN:?Set CAT_API_TOKEN before starting the API}"
    ports:
      - "${HOST_PORT:-8000}:8000"
